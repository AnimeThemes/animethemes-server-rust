services:
    server-rs:
        image: '${APP_IMAGE:-animethemes-server-rust:local}'
        container_name: animethemes-server-rs
        command: ["start"]
        restart: unless-stopped
        ports:
            - '${APP_PORT:-80}:80'
        env_file: .env
        networks:
            - rs-network
            - shared-network
        depends_on:
            redis-rs:
                condition: service_healthy
    scheduler-rs:
        image: '${APP_IMAGE:-animethemes-server-rust:local}'
        container_name: animethemes-server-rs-scheduler
        command: ["scheduler"]
        restart: unless-stopped
        env_file: .env
        networks:
            - rs-network
            - shared-network
        depends_on:
            redis-rs:
                condition: service_healthy
    worker-rs:
        image: '${APP_IMAGE:-animethemes-server-rust:local}'
        container_name: animethemes-server-rs-worker
        command: ["start", "--worker"]
        restart: unless-stopped
        env_file: .env
        networks:
            - rs-network
            - shared-network
        depends_on:
            redis-rs:
                condition: service_healthy
    redis-rs:
        image: 'redis:alpine'
        container_name: animethemes-server-rs-redis
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'redis-data:/data'
        networks:
            - rs-network
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
    mailpit-rs:
        image: 'axllent/mailpit:latest'
        container_name: animethemes-server-rs-mailpit
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - rs-network
volumes:
    redis-data:
networks:
    rs-network:
        driver: bridge
    shared-network:
        external: true