services:
    rust:
        build:
            context: .
            target: development
        container_name: animethemes-server-rust-rust
        working_dir: /app
        volumes:
            - .:/app
            - cargo-target:/app/target
            - cargo-registry:/usr/local/cargo/registry
            - cargo-git:/usr/local/cargo/git
        env_file:
            - .env
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
            typesense:
                condition: service_healthy
            mailpit:
                condition: service_started
    server:
        build:
            context: .
            target: runtime
        container_name: animethemes-server-rust
        ports:
            - '${APP_PORT:-80}:80'
        env_file:
            - .env
        depends_on:
            - mysql
            - redis
            - mailpit
            - typesense
    mysql:
        image: mysql:8.4
        container_name: animethemes-server-rust-mysql
        ports:
            - '${DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
            MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS:-}'
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:alpine'
        container_name: animethemes-server-rust-redis
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'redis-data:/data'
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
    mailpit:
        image: 'axllent/mailpit:latest'
        container_name: animethemes-server-rust-mailpit
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
    typesense:
        image: 'typesense/typesense:30.2'
        container_name: animethemes-server-rust-typesense
        ports:
            - '${FORWARD_TYPESENSE_PORT:-8108}:8108'
        environment:
            TYPESENSE_DATA_DIR: '${TYPESENSE_DATA_DIR:-/data}'
            TYPESENSE_API_KEY: '${TYPESENSE_API_KEY:-xyz}'
            TYPESENSE_ENABLE_CORS: '${TYPESENSE_ENABLE_CORS:-true}'
        volumes:
            - 'typesense-data:/data'
        healthcheck:
            test:
                - CMD
                - bash
                - '-c'
                - 'exec 3<>/dev/tcp/localhost/8108 && printf ''GET /health HTTP/1.1\r\nConnection: close\r\n\r\n'' >&3 && head -n1 <&3 | grep ''200'' && exec 3>&-'
            retries: 5
            timeout: 7s

volumes:
    cargo-target:
    cargo-registry:
    cargo-git:
    mysql_data:
    redis-data:
    typesense-data: