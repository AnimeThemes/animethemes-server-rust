            key: <%= get_env(name="VIDEO_FRA_ACCESS_KEY_ID") %>
            secret: <%= get_env(name="VIDEO_FRA_SECRET_ACCESS_KEY") %>
            region: <%= get_env(name="VIDEO_FRA_DEFAULT_REGION") %>
            bucket: <%= get_env(name="VIDEO_FRA_BUCKET") %>
            endpoint: <%= get_env(name="VIDEO_FRA_ENDPOINT") %>
        videos_local:
            driver: local
            root: public/videos
            url: <%= get_env(name="APP_URL") %>/videos
            visibility: public
        audios_nyc:
            driver: s3
            key: <%= get_env(name="AUDIO_NYC_ACCESS_KEY_ID") %>
            secret: <%= get_env(name="AUDIO_NYC_SECRET_ACCESS_KEY") %>
