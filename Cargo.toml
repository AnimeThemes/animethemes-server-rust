[workspace]
members = [
    ".",
    "migration"
]

[package]
name = "animethemes-server-rust"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "animethemes-server-rust"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace.dependencies]
loco-rs = { version = "1.1", default-features = false }

[dependencies]
loco-rs = { workspace = true , features = ["cli", "worker_redis", "cache_redis", "cache_inmem"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
tokio = { version = "1.45", default-features = false, features = [
  "rt-multi-thread",
] }
async-trait = { version = "0.1" }
axum = "0.8"
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
regex = { version = "1.11" }
async-graphql = { version = "7.2.1", features = ["chrono", "dataloader", "graphiql"] }
async-graphql-axum = "7.2.1"
typesense = "0.4.0"
sea-orm = { version = "2.0.0", features = ["sqlx-mysql", "runtime-tokio-rustls", "serde"] }
hash-ids = "0.3.1"
chrono = "0.4.45"
anyhow = "1.0.104"
dotenvy = "0.15.7"
thiserror = "2.0.20"
tower-sessions = "0.14.0"
sea-query = { version = "1.0.2", features = ["serde"] }
convert_case = "0.11.0"
sha2 = "0.11.0"
hex = "0.4.3"
uuid = { version = "1.25.0", features = ["v4"] }
bcrypt = "0.19.3"
hmac = "0.13.0"
url = "2.5.8"
tower-http = { version = "0.7.0", features = ["cors"] }
tower-sessions-redis-store = "0.16.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "multipart"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "pool", "tokio1-rustls-tls"] }
minijinja = "2.24.0"

[[bin]]
name = "animethemes-server-rust"
path = "src/bin/main.rs"
required-features = []
[[bin]]
name = "tool"
path = "src/bin/tool.rs"
required-features = []

[dev-dependencies]
loco-rs = { workspace = true, features = ["testing"] }
serial_test = { version = "3.1.1" }
rstest = { version = "0.25" }
insta = { version = "1.34", features = ["redactions", "yaml", "filters"] }
