[workspace]
members = [
    ".", "macros",
    "migration"
]

[package]
name = "animethemes-server-rust"
version = "1.0.0"
edition = "2024"
publish = false
default-run = "animethemes-server-rust"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace.dependencies]
loco-rs = { version = "1.3", default-features = false }

[dependencies]
macros = { path = "macros" }
loco-rs = { workspace = true , features = ["cli", "with-db", "worker_redis", "cache_redis", "cache_inmem", "storage_aws_s3"] }
migration = { path = "migration" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
tokio = { version = "1.54", default-features = false, features = [
  "rt-multi-thread",
] }
async-trait = { version = "0.1" }
axum = "0.8"
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
regex = { version = "1.13" }
async-graphql = { version = "7.2.1", features = ["time", "dataloader", "graphiql"] }
async-graphql-axum = "7.2.1"
typesense = "0.4.0"
sea-orm = { version = "2.0.4", default-features = false, features = ["sqlx-mysql", "runtime-tokio-rustls", "serde", "with-time"] }
hash-ids = "0.3.1"
anyhow = "1.0.105"
dotenvy = "0.15.7"
thiserror = "2.0.21"
tower-sessions = "0.14.0"
sea-query = { version = "1.0.2", features = ["serde"] }
convert_case = "0.11.0"
sha2 = "0.11.1"
hex = "0.4.3"
uuid = { version = "1.29.3", features = ["v4"] }
bcrypt = "0.19.3"
hmac = "0.13.0"
url = "2.5.9"
tower-http = { version = "0.7.1", features = ["cors"] }
tower-sessions-redis-store = "0.16.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "multipart"] }
lettre = { version = "0.11.24", default-features = false, features = ["builder", "smtp-transport", "pool", "tokio1-rustls-tls"] }
minijinja = "2.24.0"
serde_yaml = "0.9.34"
disposable = "0.1.0"
redis = { version = "1.8.3", features = ["connection-manager"] }
arc-swap = "1.9.5"
percent-encoding = "2.3.2"
rand = "0.10.4"
serenity = { version = "0.12.5", default-features = false, features = ["model", "rustls_backend"] }
validator = { version = "0.21.0", features = ["derive"] }
time = "0.3.55"

[[bin]]
name = "animethemes-server-rust"
path = "src/bin/main.rs"
required-features = []
[[bin]]
name = "tool"
path = "src/bin/tool.rs"
required-features = []

[dev-dependencies]
loco-rs = { workspace = true, features = ["testing"] }
serial_test = { version = "3.5.0" }
rstest = { version = "0.25" }
insta = { version = "1.49", features = ["redactions", "yaml", "filters"] }
