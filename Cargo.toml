[package]
name = "animethemes-server-rust"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    ".",
    "migration"
]

[dependencies]
anyhow = "1.0.104"
async-graphql = { version = "7.2.1", features = ["chrono", "dataloader", "graphiql"] }
async-graphql-axum = "7.2.1"

axum = "0.8"
bcrypt = "0.19.3"
chrono = "0.4.45"
dotenvy = "0.15"
hash-ids = "0.3.1"
sea-orm = { version = "2.0.0", features = ["sqlx-mysql", "runtime-tokio-rustls", "serde"] }
sea-query = { version = "~1.0.0", features = ["serde"] }
serde = "1.0.229"
thiserror = "2.0.20"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["cors"] }
tower-sessions = "0.14.0"
tower-sessions-redis-store = "0.16.0"
typesense = "0.4.0"
url = "2.5.8"
